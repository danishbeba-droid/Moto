<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.O.S Motos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header>
    <h1>🛠️ S.O.S Motos</h1>
    <p>Gestão & Ordens de Serviço</p>
  </header>

  <main>
    <!-- Cadastro -->
    <section class="card">
      <h2>👤 Cliente e Moto</h2>
      <input type="text" id="nome" placeholder="Nome do Cliente">
      <input type="tel" id="telefone" placeholder="WhatsApp (com DDD)">
      <input type="text" id="modelo" placeholder="Modelo da Moto (ex: Titan 160)">
      <input type="text" id="placa" placeholder="Placa">
    </section>

    <!-- Checklist -->
    <section class="card">
      <h2>📋 Checklist & Valores</h2>
      <label><input type="checkbox" id="oleo"> Nível do Óleo OK</label><br>
      <label><input type="checkbox" id="freios"> Freios OK</label><br><br>
      <textarea id="obs" placeholder="Observações do checklist..."></textarea>
      
      <input type="number" id="vPecas" placeholder="Valor Peças (R$)">
      <input type="number" id="vMaoObra" placeholder="Valor Mão de Obra (R$)">
    </section>

    <!-- Botão WhatsApp -->
    <button onclick="enviarWhatsApp()" class="btn-wa">📲 Enviar para o WhatsApp</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
