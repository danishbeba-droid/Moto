<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <title>S.O.S Motos</title>
  <link rel="manifest" href="manifest.json">
  <style>
*{box-sizing:border-box}
:root{
  --bg:#07080a;
  --panel:#121419;
  --panel2:#191c22;
  --line:#2a2e35;
  --text:#f5f7fa;
  --muted:#9298a3;
  --red:#ef2b31;
  --green:#63dd38;
  --yellow:#ffb000;
}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}
button{font:inherit}
button:active{transform:scale(.985)}
.app{
  width:min(100%,760px);
  min-height:100vh;
  margin:0 auto;
  padding-bottom:76px
}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 14px;
  background:linear-gradient(180deg,rgba(5,6,8,.98),rgba(10,11,14,.96));
  border-bottom:1px solid #20242a;
  backdrop-filter:blur(10px)
}
.iconBtn{
  position:relative;
  width:44px;
  height:44px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#14171b;
  color:#fff;
  font-size:20px
}
.bell i{
  position:absolute;
  right:-4px;
  top:-5px;
  width:19px;
  height:19px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--red);
  color:#fff;
  font-size:9px;
  font-style:normal
}
.brand{text-align:center;line-height:.95}
.brand strong{
  display:block;
  font-size:28px;
  font-weight:1000;
  font-style:italic
}
.brand span{
  display:block;
  color:var(--red);
  font-size:18px;
  font-weight:1000;
  font-style:italic;
  letter-spacing:1px
}
.brand small{
  display:block;
  margin-top:6px;
  color:#b0b5bd;
  font-size:6.5px;
  letter-spacing:2.4px
}
main{padding:14px}
.hero{padding:3px 1px 13px}
.hero h1{
  margin:0;
  font-size:24px;
  line-height:1.1
}
.hero h1 span{color:var(--red)}
.hero p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-bottom:12px
}
.stat{
  min-height:132px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:16px;
  background:linear-gradient(145deg,#181b20,#101216);
  color:#fff;
  text-align:left
}
.statIcon{
  width:40px;
  height:40px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:18px
}
.stat strong{
  display:block;
  margin:14px 0 7px;
  font-size:26px
}
.stat span{
  display:block;
  font-size:9.5px;
  line-height:1.2;
  color:#d7dae0
}
.stat.red .statIcon{background:var(--red)}
.stat.red strong{color:#ff454b}
.stat.yellow .statIcon{background:var(--yellow)}
.stat.yellow strong{color:var(--yellow)}
.stat.green .statIcon{background:var(--green)}
.stat.green strong{color:var(--green)}
.waHero{
  width:100%;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:10px;
  padding:11px;
  border:1px solid #962027;
  border-radius:16px;
  background:linear-gradient(145deg,#15171b,#0d0f12);
  color:#fff;
  text-align:left
}
.waIcon{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:3px solid #4bd479;
  font-size:18px
}
.waCopy b{
  display:block;
  font-size:11px;
  line-height:1.2
}
.waCopy small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px
}
.waHero>span{
  padding:8px 10px;
  border-radius:9px;
  background:var(--red);
  color:#fff;
  font-size:9px;
  font-weight:900
}
.sectionTitle{
  margin:15px 0 8px
}
.sectionTitle h2{
  margin:0;
  font-size:17px
}
.rowTitle{
  display:flex;
  align-items:center;
  justify-content:space-between
}
.rowTitle button{
  border:0;
  background:none;
  color:var(--red);
  font-weight:800;
  font-size:10px
}
.quick{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px
}
.quick button{
  min-height:94px;
  padding:9px 6px;
  border:1px solid var(--line);
  border-radius:15px;
  background:linear-gradient(145deg,#181b20,#101216);
  color:#fff
}
.quick b{
  display:block;
  margin-bottom:6px;
  font-size:23px
}
.quick span{
  display:block;
  font-size:9px;
  font-weight:800
}
.emptyCard{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(145deg,#17191e,#101216)
}
.emptyIcon{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:#0c0e11;
  font-size:20px
}
.emptyCard b{
  display:block;
  font-size:11px
}
.emptyCard small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px
}
.fab{
  position:fixed;
  right:max(19px,calc((100vw - 760px)/2 + 19px));
  bottom:75px;
  z-index:30;
  width:56px;
  height:56px;
  border:0;
  border-radius:50%;
  background:linear-gradient(#ff3037,#d80910);
  color:#fff;
  font-size:31px;
  box-shadow:0 12px 30px rgba(239,43,49,.28)
}
.bottom{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:25;
  width:min(760px,100%);
  height:66px;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  border-top:1px solid #20242a;
  background:rgba(10,12,15,.97)
}
.navBtn{
  border:0;
  background:none;
  color:#a9aeb6;
  font-size:8px;
  font-weight:800
}
.navBtn b{
  display:block;
  margin-bottom:2px;
  font-size:18px
}
.navBtn span{display:block}
.navBtn.active{color:var(--red)}
.navBtn.center b{
  color:#fff;
  font-size:27px
}
.toast{
  position:fixed;
  left:50%;
  bottom:84px;
  z-index:100;
  transform:translate(-50%,18px);
  width:calc(100% - 34px);
  max-width:480px;
  padding:11px 13px;
  border:1px solid #333841;
  border-radius:12px;
  background:#171a1f;
  color:#fff;
  font-size:11px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.2s ease
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}
@media(max-width:370px){
  main{padding:11px}
  .stats{gap:6px}
  .stat{min-height:124px;padding:9px}
  .stat strong{font-size:23px}
  .quick{gap:6px}
  .quick button{min-height:88px}
}


/* ETAPA 2 — CLIENTES */
.pageHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pageHead h2{margin:0;font-size:22px}
.primary,.secondary{border-radius:10px;padding:9px 12px;font-weight:850}
.primary{border:0;background:linear-gradient(#ff3037,#d90b12);color:#fff}
.secondary{border:1px solid var(--line);background:#191c21;color:#fff}
.search{width:100%;margin-bottom:11px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#0c0e11;color:#fff}
.list{display:grid;gap:8px}
.clientCard{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#17191e,#101216);padding:11px}
.clientMain{display:flex;align-items:center;gap:10px}
.clientAvatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:1px solid #444951;display:grid;place-items:center;color:var(--red);font-weight:900;font-size:14px;background:#0c0e11}
.clientInfo{flex:1;min-width:0}
.clientInfo b{display:block;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.clientInfo small{display:block;margin-top:4px;color:var(--muted);font-size:9px}
.clientActions{display:flex;gap:7px;margin-top:9px}
.clientActions button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#191c21;color:#fff;font-size:9px;font-weight:800}
.clientActions .dangerBtn{color:#ff7c82;border-color:#602429;background:#291013}
.emptyList{border:1px solid var(--line);border-radius:14px;background:#121419;padding:16px;text-align:center;color:var(--muted);font-size:10px}
.modal{display:none;position:fixed;inset:0;z-index:80;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72)}
.modal.open{display:flex}
.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:22px 22px 0 0;background:#12151a;padding:16px}
.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modalHead h2{margin:0;font-size:20px}
.closeBtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#191c21;color:#fff;font-size:22px}
.field{margin-bottom:11px}
.field label{display:block;margin-bottom:5px;color:#b5bac2;font-size:9px}
.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0c0e11;color:#fff}
.modalActions{display:flex;gap:8px;margin-top:13px}
.modalActions button{flex:1}

</style>
</head>
<body>
<div class="app">

  <header class="top">
    <button id="menuBtn" class="iconBtn" aria-label="Menu">☰</button>

    <div class="brand" aria-label="S.O.S Motos">
      <strong>S.O.S</strong>
      <span>MOTOS</span>
      <small>OFICINA ESPECIALIZADA</small>
    </div>

    <button id="bellBtn" class="iconBtn bell" aria-label="Notificações">
      🔔
      <i>0</i>
    </button>
  </header>

  <main>
    <section id="inicio" class="view active">

      <div class="hero">
        <h1>Bom dia, <span>Daniel!</span></h1>
        <p>Confira o resumo da sua oficina</p>
      </div>

      <div class="stats">
        <button class="stat red" data-action="Motos em serviço">
          <div class="statIcon">🏍️</div>
          <strong>0</strong>
          <span>Motos em serviço</span>
        </button>

        <button class="stat yellow" data-action="Aguardando aprovação">
          <div class="statIcon">⏱️</div>
          <strong>0</strong>
          <span>Aguardando aprovação</span>
        </button>

        <button class="stat green" data-action="Serviços concluídos">
          <div class="statIcon">✅</div>
          <strong>0</strong>
          <span>Serviços concluídos</span>
        </button>
      </div>

      <button id="waHero" class="waHero">
        <div class="waIcon">◉</div>
        <div class="waCopy">
          <b>Orçamentos e avisos no WhatsApp</b>
          <small>Comunicação direta com o cliente</small>
        </div>
        <span>Enviar</span>
      </button>

      <div class="sectionTitle">
        <h2>Acesso rápido</h2>
      </div>

      <div class="quick">
        <button data-action="Clientes">
          <b>👤</b>
          <span>Clientes</span>
        </button>

        <button data-action="Motos">
          <b>🏍️</b>
          <span>Motos</span>
        </button>

        <button data-action="Nova OS">
          <b>🛠️</b>
          <span>Nova OS</span>
        </button>

        <button data-action="Orçamentos">
          <b>▧</b>
          <span>Orçamentos</span>
        </button>

        <button data-action="WhatsApp">
          <b>◉</b>
          <span>WhatsApp</span>
        </button>

        <button data-action="Mais">
          <b>•••</b>
          <span>Mais</span>
        </button>
      </div>

      <div class="sectionTitle rowTitle">
        <h2>Serviços em andamento</h2>
        <button id="verTodosBtn">Ver todos ›</button>
      </div>

      <div class="emptyCard">
        <div class="emptyIcon">🔧</div>
        <div>
          <b>Nenhum serviço em andamento</b>
          <small>As ordens de serviço aparecerão aqui.</small>
        </div>
      </div>

    </section>
  
<section id="clientes" class="view">
  <div class="pageHead">
    <h2>Clientes</h2>
    <button type="button" class="primary" onclick="abrirCliente()">+ Novo</button>
  </div>

  <input id="buscaCliente" class="search" type="search"
         placeholder="Buscar por nome ou WhatsApp..."
         oninput="renderClientes()">

  <div id="listaClientes" class="list"></div>
</section>

</main>

  <button id="fabBtn" class="fab" aria-label="Nova OS">+</button>

  <nav class="bottom">
    <button class="navBtn active" data-action="Início">
      <b>⌂</b><span>Início</span>
    </button>
    <button class="navBtn" data-action="Clientes">
      <b>👤</b><span>Clientes</span>
    </button>
    <button class="navBtn center" data-action="Nova OS">
      <b>＋</b><span>Nova OS</span>
    </button>
    <button class="navBtn" data-action="Orçamentos">
      <b>▧</b><span>Orçamentos</span>
    </button>
    <button class="navBtn" data-action="Mais">
      <b>▦</b><span>Mais</span>
    </button>
  </nav>

</div>


<div id="modalCliente" class="modal" onclick="fecharModalNoFundo(event)">
  <div class="sheet">
    <div class="modalHead">
      <h2 id="tituloCliente">Novo cliente</h2>
      <button type="button" class="closeBtn" onclick="fecharCliente()">×</button>
    </div>

    <input id="clienteId" type="hidden">

    <div class="field">
      <label>Nome</label>
      <input id="clienteNome" type="text" placeholder="Nome completo">
    </div>

    <div class="field">
      <label>WhatsApp</label>
      <input id="clienteWhats" type="tel" inputmode="tel" placeholder="(00) 00000-0000">
    </div>

    <div class="modalActions">
      <button type="button" class="secondary" onclick="fecharCliente()">Cancelar</button>
      <button type="button" class="primary" onclick="salvarCliente()">Salvar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>

const KEY='SOS_MOTOS_REINICIO_CLIENTES_V2';
let clientes=carregarClientes();
let toastTimer=null;

function el(id){return document.getElementById(id)}

function carregarClientes(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'[]');
    return Array.isArray(d)?d:[];
  }catch(e){
    return [];
  }
}

function persistir(){
  localStorage.setItem(KEY,JSON.stringify(clientes));
}

function showToast(text){
  clearTimeout(toastTimer);
  el('toast').textContent=text;
  el('toast').classList.add('show');
  toastTimer=setTimeout(()=>el('toast').classList.remove('show'),1600);
}

function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));
  if(id==='clientes')renderClientes();
  window.scrollTo(0,0);
}

function future(nome){showToast(nome+' — próxima etapa.')}

function iniciais(nome){
  return String(nome||'?').trim().split(/\s+/).slice(0,2).map(p=>p[0]||'').join('').toUpperCase();
}

function safe(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function abrirCliente(id=0){
  const c=clientes.find(x=>x.id===Number(id));
  el('clienteId').value=c?.id||'';
  el('clienteNome').value=c?.nome||'';
  el('clienteWhats').value=c?.whatsapp||'';
  el('tituloCliente').textContent=c?'Editar cliente':'Novo cliente';
  el('modalCliente').classList.add('open');
}

function fecharCliente(){
  el('modalCliente').classList.remove('open');
}

function fecharModalNoFundo(event){
  if(event.target.id==='modalCliente')fecharCliente();
}

function salvarCliente(){
  const id=Number(el('clienteId').value||0);
  const nome=el('clienteNome').value.trim();
  const whatsapp=el('clienteWhats').value.trim();

  if(!nome){
    showToast('Informe o nome.');
    return;
  }

  if(id){
    const c=clientes.find(x=>x.id===id);
    if(c){c.nome=nome;c.whatsapp=whatsapp}
  }else{
    clientes.push({id:Date.now(),nome,whatsapp});
  }

  persistir();
  fecharCliente();
  renderClientes();
  showToast(id?'Cliente atualizado.':'Cliente cadastrado.');
}

function editarCliente(id){abrirCliente(id)}

function excluirCliente(id){
  const c=clientes.find(x=>x.id===id);
  if(!c)return;
  if(!confirm('Excluir '+c.nome+'?'))return;
  clientes=clientes.filter(x=>x.id!==id);
  persistir();
  renderClientes();
}

function renderClientes(){
  const lista=el('listaClientes');
  if(!lista)return;

  const termo=(el('buscaCliente')?.value||'').trim().toLowerCase();
  const arr=clientes
    .slice()
    .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))
    .filter(c=>`${c.nome} ${c.whatsapp||''}`.toLowerCase().includes(termo));

  lista.innerHTML=arr.length?arr.map(c=>`
    <div class="clientCard">
      <div class="clientMain">
        <div class="clientAvatar">${safe(iniciais(c.nome))}</div>
        <div class="clientInfo">
          <b>${safe(c.nome)}</b>
          <small>${safe(c.whatsapp||'WhatsApp não informado')}</small>
        </div>
      </div>
      <div class="clientActions">
        <button type="button" onclick="editarCliente(${c.id})">Editar</button>
        <button type="button" class="dangerBtn" onclick="excluirCliente(${c.id})">Excluir</button>
      </div>
    </div>
  `).join(''):'<div class="emptyList">Nenhum cliente cadastrado ainda.</div>';
}

/* Conecta SOMENTE os botões existentes da home. */
document.querySelectorAll('[data-action]').forEach(btn=>{
  btn.onclick=()=>{
    const a=btn.dataset.action;
    if(a==='Início')showView('inicio');
    else if(a==='Clientes')showView('clientes');
    else future(a);
  };
});

el('menuBtn').onclick=()=>future('Menu');
el('bellBtn').onclick=()=>future('Notificações');
el('waHero').onclick=()=>future('WhatsApp');
el('verTodosBtn').onclick=()=>future('Ordens de Serviço');
el('fabBtn').onclick=()=>future('Nova OS');

renderClientes();

</script>
</body>
</html>
