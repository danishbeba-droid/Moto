<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <title>S.O.S Motos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <button id="menuBtn" class="iconBtn" aria-label="Menu">☰</button>

    <div class="brand" aria-label="S.O.S Motos">
      <strong>S.O.S</strong>
      <span>MOTOS</span>
      <small>OFICINA ESPECIALIZADA</small>
    </div>

    <button id="bellBtn" class="iconBtn bell" aria-label="Notificações">
      🔔
      <i>0</i>
    </button>
  </header>

  <main>
    <section id="inicio" class="view active">

      <div class="hero">
        <h1>Bom dia, <span>Daniel!</span></h1>
        <p>Confira o resumo da sua oficina</p>
      </div>

      <div class="stats">
        <button class="stat red" data-action="Motos em serviço">
          <div class="statIcon">🏍️</div>
          <strong>0</strong>
          <span>Motos em serviço</span>
        </button>

        <button class="stat yellow" data-action="Aguardando aprovação">
          <div class="statIcon">⏱️</div>
          <strong>0</strong>
          <span>Aguardando aprovação</span>
        </button>

        <button class="stat green" data-action="Serviços concluídos">
          <div class="statIcon">✅</div>
          <strong>0</strong>
          <span>Serviços concluídos</span>
        </button>
      </div>

      <button id="waHero" class="waHero">
        <div class="waIcon">◉</div>
        <div class="waCopy">
          <b>Orçamentos e avisos no WhatsApp</b>
          <small>Comunicação direta com o cliente</small>
        </div>
        <span>Enviar</span>
      </button>

      <div class="sectionTitle">
        <h2>Acesso rápido</h2>
      </div>

      <div class="quick">
        <button data-action="Clientes">
          <b>👤</b>
          <span>Clientes</span>
        </button>

        <button data-action="Motos">
          <b>🏍️</b>
          <span>Motos</span>
        </button>

        <button data-action="Nova OS">
          <b>🛠️</b>
          <span>Nova OS</span>
        </button>

        <button data-action="Orçamentos">
          <b>▧</b>
          <span>Orçamentos</span>
        </button>

        <button data-action="WhatsApp">
          <b>◉</b>
          <span>WhatsApp</span>
        </button>

        <button data-action="Mais">
          <b>•••</b>
          <span>Mais</span>
        </button>
      </div>

      <div class="sectionTitle rowTitle">
        <h2>Serviços em andamento</h2>
        <button id="verTodosBtn">Ver todos ›</button>
      </div>

      <div class="emptyCard">
        <div class="emptyIcon">🔧</div>
        <div>
          <b>Nenhum serviço em andamento</b>
          <small>As ordens de serviço aparecerão aqui.</small>
        </div>
      </div>

    </section>
  </main>

  <button id="fabBtn" class="fab" aria-label="Nova OS">+</button>

  <nav class="bottom">
    <button class="navBtn active" data-action="Início">
      <b>⌂</b><span>Início</span>
    </button>
    <button class="navBtn" data-action="Clientes">
      <b>👤</b><span>Clientes</span>
    </button>
    <button class="navBtn center" data-action="Nova OS">
      <b>＋</b><span>Nova OS</span>
    </button>
    <button class="navBtn" data-action="Orçamentos">
      <b>▧</b><span>Orçamentos</span>
    </button>
    <button class="navBtn" data-action="Mais">
      <b>▦</b><span>Mais</span>
    </button>
  </nav>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
