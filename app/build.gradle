plugins {
    id "com.android.application"
}

android {
    namespace "br.com.sosmotos.app"
    compileSdk 35

    defaultConfig {
        applicationId "br.com.sosmotos.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
